name: Publish to MCP Registry

# Publishes this server to the official MCP Registry
# (https://registry.modelcontextprotocol.io) on every version tag.
#
# The registry entry is the *remote* Streamable HTTP endpoint served by
# apistatuscheck.com itself, NOT the npm package. That is deliberate: the
# registry verifies npm ownership by reading `mcpName` out of the published
# tarball, which needs an NPM_TOKEN this repo does not have. A remote entry is
# verified by GitHub OIDC alone, which grants the `io.github.shibley/*`
# namespace from this repository's identity — no secrets are stored anywhere,
# so this publishes with zero human setup.
#
# The stdio npm package still lives in src/ and can be added back to
# server.json as a `packages` entry once an NPM_TOKEN exists; it is left out
# here so a missing token cannot block the listing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify the remote endpoint is actually up before advertising it
        run: |
          set -euo pipefail
          url=$(jq -r '.remotes[0].url' server.json)
          echo "Handshaking $url"
          body=$(curl -sS -m 30 "$url" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          echo "$body" | head -c 400
          echo "$body" | jq -e '.result.protocolVersion' > /dev/null

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Set version in server.json from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
